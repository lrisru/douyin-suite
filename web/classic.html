<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>抖音综合工具</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    font: 12px/1.35 "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #ececec; color: #222; overflow: hidden;
  }

  /* 左栏：浏览器（原版独占左半边全高） */
  .left { width: 34%; min-width: 300px; display: flex; flex-direction: column; border-right: 1px solid #b8b8b8; background: #fff; }
  .browser-bar { display: flex; gap: 2px; padding: 2px; border-bottom: 1px solid #d0d0d0; background: #f2f2f2; flex-shrink: 0; }
  .browser-bar .home { padding: 2px 6px; border: 1px solid #adadad; background: #f7f7f7; font-size: 11px; cursor: pointer; }
  .browser-bar input { flex: 1; padding: 2px 4px; border: 1px solid #b8b8b8; font-size: 11px; min-width: 0; }
  .browser-bar .grab { padding: 2px 6px; border: 1px solid #adadad; background: #f7f7f7; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .browser-view { flex: 1; overflow: hidden; background: #1a1a1a; display: flex; align-items: flex-start; justify-content: center; }
  .browser-view img { width: 100%; height: auto; display: block; }
  .browser-view .ph { color: #999; font-size: 12px; padding: 20px; }

  /* 右栏：菜单 + 控制 + 表格 */
  .right { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }

  .menubar { display: flex; align-items: center; gap: 1px; padding: 2px; background: #f2f2f2; border-bottom: 1px solid #b8b8b8; flex-shrink: 0; overflow-x: auto; }
  .menubar button {
    padding: 3px 7px; border: 1px solid #adadad; background: #f7f7f7;
    font-size: 11px; cursor: pointer; white-space: nowrap; border-radius: 1px;
  }
  .menubar button:hover { background: #e8f0fb; }
  .menubar button.active { background: #cfe3fa; border-color: #5b9bd5; font-weight: 600; }
  .menubar .spacer { flex: 1; }
  .menubar .qr { background: #2b7fb8; color: #fff; border-color: #2b7fb8; }

  .links-area { display: flex; gap: 3px; padding: 3px; border-bottom: 1px solid #d0d0d0; flex-shrink: 0; height: 118px; }
  .links-area .col { display: flex; flex-direction: column; gap: 2px; }
  .links-area textarea { flex: 1; border: 1px solid #b8b8b8; font-size: 11px; padding: 1px 3px; resize: none; font-family: Consolas, monospace; }

  button.act { padding: 3px 8px; border: 1px solid #adadad; background: #f7f7f7; font-size: 11px; cursor: pointer; }
  button.act:hover { background: #e8f0fb; }
  button.act.primary { background: #e8543f; color: #fff; border-color: #c9432f; font-weight: 600; }
  button.act.primary:hover { background: #d3452f; }

  .filter { padding: 3px 4px; border-bottom: 1px solid #d0d0d0; background: #fafafa; flex-shrink: 0; }
  .filter .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
  .filter label { display: flex; align-items: center; gap: 3px; font-size: 11px; white-space: nowrap; }
  .filter input[type=text], .filter input[type=date], .filter select {
    flex: 1; border: 1px solid #b8b8b8; padding: 1px 3px; font-size: 11px; min-width: 0; height: 20px;
  }
  .filter .row2 { display: flex; gap: 2px; margin-top: 3px; flex-wrap: wrap; }

  .table-wrap { flex: 1; overflow: auto; background: #fff; min-height: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th, td { border: 1px solid #dcdcdc; padding: 1px 4px; text-align: left; white-space: nowrap; }
  th { background: #f0f0f0; position: sticky; top: 0; font-weight: 600; z-index: 1; height: 22px; }
  td { height: 20px; }
  tr:nth-child(even) td { background: #fafafa; }
  tr:hover td { background: #eef5ff; }
  td.wrap { white-space: normal; max-width: 220px; }

  .statusbar {
    flex-shrink: 0; padding: 1px 6px; background: #f0f0f0; border-top: 1px solid #b8b8b8;
    font-size: 11px; color: #555; display: flex; gap: 12px;
  }
  .statusbar .dot { color: #2e9e4f; }
  .toast-box { position: fixed; top: 8px; right: 8px; z-index: 99; display: flex; flex-direction: column; gap: 4px; }
  .toast { padding: 5px 10px; background: #333; color: #fff; border-radius: 3px; font-size: 11px; }
  .toast.ok { background: #2e9e4f; }
  .toast.warn { background: #c98a1a; }
  .toast.error { background: #c9432f; }

  /* 内嵌对话框（替代 prompt，避免被浏览器拦截） */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .modal-box { background: #fff; border: 1px solid #b8b8b8; border-radius: 3px; width: 420px; padding: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .modal-title { font-weight: 600; margin-bottom: 6px; font-size: 12px; }
  .modal-box textarea { width: 100%; height: 96px; border: 1px solid #b8b8b8; padding: 4px 6px; font-size: 12px; resize: vertical; font-family: inherit; }
  .modal-btns { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  .modal-btns button { padding: 4px 14px; border: 1px solid #adadad; background: #f7f7f7; cursor: pointer; font-size: 12px; }
  .modal-btns button.ok { background: #2b7fb8; color: #fff; border-color: #2b7fb8; }
</style>
</head>
<body>
  <div class="left">
    <div class="browser-bar">
      <button class="home" onclick="CL.home()">首页</button>
      <input id="url" value="https://www.douyin.com" />
      <button class="grab" onclick="CL.grabCurrent()">一键视频采集</button>
    </div>
    <div class="browser-view">
      <img id="screen" alt="" />
      <div class="ph" id="screen-ph">浏览器画面加载中…</div>
    </div>
  </div>

  <div class="right">
    <div class="menubar">
      <button data-mod="auto">【引流】自动化操作区</button>
      <button data-mod="search-video">【采集】搜索视频</button>
      <button data-mod="comments" class="active">【采集】视频评论</button>
      <button data-mod="group">【采集】群成员</button>
      <button data-mod="video-user">【采集】视频/用户</button>
      <button data-mod="live">【采集】直播间</button>
      <span class="spacer"></span>
      <button onclick="CL.toast('已是最新版本')">更新</button>
      <button class="qr" onclick="CL.showQr()">用户二维码</button>
    </div>

    <!-- 关键词搜索区（仅【采集】搜索视频时显示） -->
    <div class="links-area" id="search-area" style="display:none">
      <div class="col" style="flex:1">
        <div style="display:flex;gap:2px;align-items:center">
          关键词 <input id="kw" style="flex:1;height:20px;padding:1px 4px;border:1px solid #b8b8b8" placeholder="如 杭州汽车膜 （多个词用 | 分隔）" />
          <input id="kw-limit" type="number" value="20" style="width:56px;height:20px;padding:1px 4px;border:1px solid #b8b8b8" title="数量" />
          <button class="act primary" onclick="CL.searchVideo()">搜索视频</button>
          <button class="act" onclick="CL.loadItems()">刷新列表</button>
        </div>
        <div style="font-size:11px;color:#777;margin-top:2px">搜索后在下方表格里勾选，点「导出Excel」或「下载选中」</div>
      </div>
    </div>

    <div class="links-area">
      <div class="col" style="flex:1">
        <div style="display:flex;gap:2px">
          <button class="act" onclick="CL.refresh()">刷新数据</button>
          <button class="act" onclick="CL.addLink()">添加链接</button>
          <button class="act" onclick="CL.clearLinks()">清空链接</button>
        </div>
        <textarea id="links" placeholder="每行一个抖音链接"></textarea>
      </div>
      <div class="col" style="width:88px">
        <button class="act primary" onclick="CL.start()">开始采集</button>
        <button class="act" onclick="CL.stop()">停止采集</button>
        <button class="act" onclick="CL.backup()">未备份</button>
        <button class="act" onclick="CL.restore()">恢复备份</button>
      </div>
    </div>

    <div class="filter">
      <label style="margin-bottom:2px"><input type="checkbox" id="f-live" /> 实时筛选</label>
      <div class="grid">
        <label>地区含 <input type="text" id="f-city" /></label>
        <label>性别 <select id="f-gender"><option value="">不限制</option><option value="1">男</option><option value="2">女</option></select></label>
        <label>评论含 <input type="text" id="f-contain" /></label>
        <label>降重 <select id="f-dup"><option value="">不限制</option><option value="1">按用户</option><option value="2">按内容</option></select></label>
        <label>评不含 <input type="text" id="f-exclude" /></label>
        <label>日期起 <input type="date" id="f-date" /></label>
        <label style="grid-column:span 2"><input type="checkbox" id="f-dedup-user" /> 去除重复发言用户</label>
      </div>
      <div class="row2">
        <button class="act" onclick="CL.applyFilter()">一键筛选</button>
        <button class="act" onclick="CL.deleteSelected()">删除选中</button>
        <button class="act" onclick="CL.enrich()">补全资料</button>
        <button class="act" onclick="CL.exportExcel()">导出Excel</button>
        <button class="act" onclick="CL.importExcel()">导入Excel</button>
        <button class="act" onclick="CL.genScript()">生成话术</button><button class="act" onclick="CL.dmSelected()">私信选中</button>
        <button class="act" id="btn-danmu" style="display:none" onclick="CL.collectDanmu()">采弹幕</button>
        <button class="act" onclick="CL.selectAll()">全选</button>
      </div>
    </div>

    <!-- 监控面板（点【引流】自动化操作区时显示） -->
    <div class="watch-panel" id="watch-panel" style="display:none; padding:4px; border-bottom:1px solid #d0d0d0; background:#fafafa;">
      <div style="display:flex; gap:3px; align-items:center; flex-wrap:wrap; margin-bottom:3px">
        <select id="w-type" style="height:20px"><option value="user_new_works">博主新作品</option><option value="video_new_comments">视频新评论</option></select>
        <input id="w-target" placeholder="sec_uid 或 视频链接/ID" style="flex:1; min-width:180px; height:20px; padding:1px 3px; border:1px solid #b8b8b8" />
        <input id="w-note" placeholder="备注（如 三哥车问）" style="width:110px; height:20px; padding:1px 3px; border:1px solid #b8b8b8" />
        <input id="w-interval" type="number" value="600" style="width:60px; height:20px; padding:1px 3px; border:1px solid #b8b8b8" title="检查间隔（秒）" />
        <button class="act" onclick="CL.addWatch()">添加监控</button>
        <button class="act" onclick="CL.loadWatches()">刷新</button>
      </div>
      <div style="max-height:180px; overflow:auto; background:#fff; border:1px solid #dcdcdc">
        <table id="watch-tbl" style="width:100%; border-collapse:collapse; font-size:11px">
          <thead><tr><th>#</th><th>类型</th><th>目标</th><th>备注</th><th>间隔</th><th>上次检查</th><th>命中</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div style="font-size:11px;color:#777;margin-top:2px">监控发现新作品/新评论时会入库并推送通知（需在「设置」里配好 Webhook）</div>
    </div>

    <div class="table-wrap">
      <table id="tbl">
        <thead><tr>
          <th style="width:22px"></th>
          <th>编号</th><th>链接</th><th>时间</th><th>昵称</th><th>评论内容</th>
          <th>UID</th><th>抖音号</th><th>性别</th><th>地区</th><th>简介</th><th>粉丝</th><th>关注</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="statusbar">
      <span><span class="dot">●</span> <span id="st-msg">就绪</span></span>
      <span>共 <b id="st-total">0</b> 条</span>
      <span>已选 <b id="st-sel">0</b></span>
      <span id="st-acct"></span>
    </div>
  </div>

  <div class="modal" id="modal" style="display:none">
    <div class="modal-box">
      <div class="modal-title" id="modal-title"></div>
      <textarea id="modal-input"></textarea>
      <div class="modal-btns">
        <button onclick="CL.modalClose(null)">取消</button>
        <button class="ok" onclick="CL.modalClose(document.querySelector('#modal-input').value)">确定</button>
      </div>
    </div>
  </div>
  <div class="toast-box" id="toast"></div>

<script src="classic.js"></script>
</body>
</html>
