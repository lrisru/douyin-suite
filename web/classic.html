<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>抖音综合工具</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 12px/1.4 "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f0f0f0; color: #222; overflow: hidden;
  }
  /* 顶部菜单条 */
  .menubar {
    display: flex; align-items: center; gap: 2px; padding: 3px 6px;
    background: linear-gradient(#fdfdfd, #ececec); border-bottom: 1px solid #b8b8b8;
    flex-shrink: 0;
  }
  .menubar button {
    padding: 3px 9px; border: 1px solid #adadad; background: #f7f7f7;
    font-size: 12px; cursor: pointer; border-radius: 2px; white-space: nowrap;
  }
  .menubar button:hover { background: #e8f0fb; border-color: #7ba7d7; }
  .menubar button.active { background: #cfe3fa; border-color: #5b9bd5; font-weight: 600; }
  .menubar .spacer { flex: 1; }
  .menubar .qr { background: #2b7fb8; color: #fff; border-color: #2b7fb8; }

  /* 主体：左浏览器 + 右控制 */
  .main { flex: 1; display: flex; min-height: 0; padding: 4px; gap: 4px; }

  .pane { background: #fff; border: 1px solid #b8b8b8; display: flex; flex-direction: column; min-height: 0; }

  /* 左：浏览器 */
  .browser { width: 42%; }
  .browser-bar { display: flex; gap: 3px; padding: 3px; border-bottom: 1px solid #d0d0d0; background: #f5f5f5; }
  .browser-bar input { flex: 1; padding: 2px 5px; border: 1px solid #b8b8b8; font-size: 11px; }
  .browser-bar button { padding: 2px 8px; font-size: 11px; border: 1px solid #adadad; background: #f7f7f7; cursor: pointer; }
  .browser-view { flex: 1; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; }
  .browser-view img { width: 100%; height: 100%; object-fit: contain; display: block; background: #1a1a1a; }
  .browser-view .ph { color: #888; font-size: 12px; }

  /* 右：控制区 */
  .ctrl { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .links-area { display: flex; gap: 4px; padding: 4px; border-bottom: 1px solid #d0d0d0; }
  .links-area .col { display: flex; flex-direction: column; gap: 3px; }
  .links-area textarea { flex: 1; border: 1px solid #b8b8b8; font-size: 11px; padding: 2px 4px; resize: none; font-family: Consolas, monospace; }

  button.act {
    padding: 4px 10px; border: 1px solid #adadad; background: #f7f7f7;
    font-size: 12px; cursor: pointer; border-radius: 2px;
  }
  button.act:hover { background: #e8f0fb; }
  button.act.primary { background: #e8543f; color: #fff; border-color: #c9432f; font-weight: 600; }
  button.act.primary:hover { background: #d3452f; }
  button.act:disabled { opacity: .5; cursor: not-allowed; }

  /* 条件筛选 */
  .filter { padding: 5px; border-bottom: 1px solid #d0d0d0; background: #fafafa; }
  .filter .title { font-weight: 600; margin-bottom: 4px; }
  .filter .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 10px; }
  .filter label { display: flex; align-items: center; gap: 4px; font-size: 11px; }
  .filter input[type=text], .filter input[type=date], .filter select {
    flex: 1; border: 1px solid #b8b8b8; padding: 2px 4px; font-size: 11px; min-width: 0;
  }
  .filter .row2 { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }

  /* 底部表格 */
  .table-wrap { flex: 1; overflow: auto; border-top: 1px solid #b8b8b8; background: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th, td { border: 1px solid #e2e2e2; padding: 2px 5px; text-align: left; white-space: nowrap; }
  th { background: #f0f0f0; position: sticky; top: 0; font-weight: 600; z-index: 1; }
  tr:nth-child(even) td { background: #fafafa; }
  tr:hover td { background: #eef5ff; }
  td.wrap { white-space: normal; max-width: 260px; }

  /* 状态栏 */
  .statusbar {
    flex-shrink: 0; padding: 2px 8px; background: #f0f0f0; border-top: 1px solid #b8b8b8;
    font-size: 11px; color: #555; display: flex; gap: 14px;
  }
  .statusbar .dot { color: #2e9e4f; }
  .toast-box { position: fixed; top: 8px; right: 8px; z-index: 99; display: flex; flex-direction: column; gap: 4px; }
  .toast { padding: 6px 12px; background: #333; color: #fff; border-radius: 3px; font-size: 12px; }
  .toast.ok { background: #2e9e4f; }
  .toast.warn { background: #c98a1a; }
  .toast.error { background: #c9432f; }
</style>
</head>
<body>
  <div class="menubar">
    <button data-mod="auto">【引流】自动化操作区</button>
    <button data-mod="search-video">【采集】搜索视频</button>
    <button data-mod="comments" class="active">【采集】视频评论</button>
    <button data-mod="group">【采集】群成员</button>
    <button data-mod="video-user">【采集】视频/用户</button>
    <span class="spacer"></span>
    <button onclick="CL.toast('已是最新版本')">更新</button>
    <button class="qr" onclick="CL.showQr()">用户二维码</button>
  </div>

  <div class="main">
    <!-- 左：浏览器 -->
    <div class="pane browser">
      <div class="browser-bar">
        <input id="url" value="https://www.douyin.com/discover" />
        <button onclick="CL.openUrl()">打开</button>
        <button onclick="CL.grabCurrent()">一键视频采集</button>
      </div>
      <div class="browser-view">
        <img id="screen" alt="" />
        <div class="ph" id="screen-ph">浏览器画面加载中…</div>
      </div>
    </div>

    <!-- 右：控制 -->
    <div class="pane ctrl">
      <div class="links-area">
        <div class="col" style="flex:1">
          <div style="display:flex;gap:4px">
            <button class="act" onclick="CL.addLink()">添加链接</button>
            <button class="act" onclick="CL.clearLinks()">清空链接</button>
          </div>
          <textarea id="links" rows="6" placeholder="每行一个抖音链接，例如
https://www.douyin.com/video/7532780281573510446
https://www.douyin.com/user/MS4wLjABAAAA..."></textarea>
        </div>
        <div class="col" style="width:96px">
          <button class="act primary" onclick="CL.start()">开始采集</button>
          <button class="act" onclick="CL.stop()">停止采集</button>
          <button class="act" onclick="CL.backup()">备份</button>
          <button class="act" onclick="CL.restore()">恢复备份</button>
        </div>
      </div>

      <div class="filter">
        <div class="title">条件筛选 <label style="font-weight:400;margin-left:10px"><input type="checkbox" id="f-live" /> 实时筛选</label></div>
        <div class="grid">
          <label>地区含 <input type="text" id="f-city" placeholder="如 杭州" /></label>
          <label>性别 <select id="f-gender"><option value="">不限制</option><option value="1">男</option><option value="2">女</option></select></label>
          <label>评论含 <input type="text" id="f-contain" placeholder="如 多少钱" /></label>
          <label>降重 <select id="f-dup"><option value="">不限制</option><option value="1">按用户去重</option><option value="2">按内容去重</option></select></label>
          <label>评不含 <input type="text" id="f-exclude" placeholder="排除词" /></label>
          <label>日期起 <input type="date" id="f-date" /></label>
          <label style="grid-column:span 2"><input type="checkbox" id="f-dedup-user" /> 去除重复发言用户</label>
        </div>
        <div class="row2">
          <button class="act" onclick="CL.applyFilter()">一键筛选</button>
          <button class="act" onclick="CL.clearFilter()">清空条件</button>
          <button class="act" onclick="CL.enrich()">补全评论者资料</button>
          <button class="act" onclick="CL.exportExcel()">导出Excel</button>
          <button class="act" onclick="CL.importExcel()">导入Excel</button>
          <button class="act" onclick="CL.dmSelected()">私信选中</button>
          <button class="act" onclick="CL.selectAll()">全选</button>
        </div>
      </div>

      <div class="table-wrap">
        <table id="tbl">
          <thead><tr>
            <th style="width:26px"></th>
            <th>编号</th><th>链接</th><th>时间</th><th>昵称</th><th>评论内容</th>
            <th>UID</th><th>抖音号</th><th>性别</th><th>地区</th><th>简介</th><th>粉丝</th><th>关注</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <span><span class="dot">●</span> <span id="st-msg">就绪</span></span>
    <span>共 <b id="st-total">0</b> 条</span>
    <span>已选 <b id="st-sel">0</b></span>
    <span id="st-acct"></span>
  </div>

  <div class="toast-box" id="toast"></div>

<script src="classic.js"></script>
</body>
</html>
